name: Staging public smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Staging public browser smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    env:
      CI: "true"
      E2E_ALLOW_REMOTE: "1"
      E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
      E2E_APPROVED_HOST: ${{ vars.E2E_APPROVED_HOST }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify checked-out source identity
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm install --global npm@11.21.1
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:e2e
